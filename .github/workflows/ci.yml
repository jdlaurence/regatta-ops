# PLAN.md §11.3: typecheck, lint, unit tests with coverage, build, then the Playwright flows:
# the phase demos against demo mode, and the smoke suite against a real PocketBase (temporary
# data folder, migrated and seeded) serving the built app. See apps/web/playwright.config.ts.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm --filter @srt/domain coverage
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pb:download
      - run: pnpm --filter @srt/backend test

  e2e:
    runs-on: ubuntu-latest
    needs: [check, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pb:download
      - run: pnpm --filter @srt/web exec playwright install --with-deps chromium
      - name: Playwright, demo mode (phase demos)
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/demo
      - name: Playwright, PocketBase (smoke suite)
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:pb
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/pocketbase
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
